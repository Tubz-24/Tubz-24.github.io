<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiss Off Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628; --blue:#4A90D9; --sky:#85B7EB; --white:#FFFFFF; --gold:#E8B64C;
  --soft:rgba(255,255,255,.74); --line:rgba(133,183,235,.32);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#0A1628; } }
:root[data-theme="dark"]{ --navy:#0A1628; }
html{height:100%;background:#0A1628;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--navy);color:var(--white);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;max-width:560px;margin:0 auto;padding:8px 14px 12px}
.hud{width:100%;display:flex;justify-content:space-between;gap:8px;padding:2px 4px 10px}
.stat{display:flex;flex-direction:column}
.hud{align-items:center}
.snd{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);border-radius:12px;background:rgba(74,144,217,.16);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
.snd svg{width:22px;height:22px}
.snd[aria-pressed="false"]{color:var(--soft);background:transparent}
.stat .k{font-size:13px;color:var(--soft)}
.stat .v{font-family:'Bungee','Figtree',sans-serif;font-size:21px;line-height:1.15}
#hLives{color:var(--gold)}
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 1px var(--line);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.card{background:rgba(10,22,40,.94);border:1px solid var(--line);border-radius:20px;padding:24px 20px 22px;max-width:340px;width:100%;max-height:100%;overflow:auto;text-align:center}
input{-webkit-user-select:text;user-select:text}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--sky);font:600 15px 'Figtree',system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.board{list-style:none;margin:0 0 12px;padding:0;text-align:left}
.board li{display:grid;grid-template-columns:26px 1fr auto 64px;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px}
.board li:nth-child(odd){background:rgba(255,255,255,.04)}
.board .r,.board .l{color:var(--soft);font-size:13px}
.board .n{font-family:'Bungee','Figtree',sans-serif;font-size:16px;letter-spacing:1px}
.board .s{font-family:'Bungee','Figtree',sans-serif;text-align:right}
.board li.me{background:rgba(232,182,76,.2);color:var(--gold)}
.board li.me .r,.board li.me .l{color:var(--gold)}
.ini{display:block;font-size:13px;color:var(--soft);margin:0 0 16px}
.ini input{display:block;margin:8px auto 0;width:140px;text-align:center;font-family:'Bungee','Figtree',sans-serif;font-size:30px;letter-spacing:6px;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px}
.ini input:focus{outline:3px solid var(--sky);outline-offset:2px}
.splash{position:fixed;inset:0;z-index:10;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer;transition:opacity .45s ease}
.splash.gone{opacity:0;pointer-events:none}
#splashArt{width:min(340px,88vw);height:auto;aspect-ratio:320/150;display:block}
.splash[hidden]{display:none}
.splash h1{font-family:'Bungee','Figtree',sans-serif;font-weight:400;font-size:clamp(44px,13vw,72px);line-height:.95;margin:0;color:var(--sky);text-align:center}
.track{position:relative;width:250px;height:44px}
.clip{position:absolute;left:0;top:8px;height:28px;width:212px;overflow:hidden}
.worm{position:absolute;top:0;left:0;display:flex;gap:3px;animation:slide 2.8s cubic-bezier(.45,0,.6,1) infinite}
.worm i{display:block;width:26px;height:26px;border-radius:8px;background:#D9A43E}
.worm i:last-child{background:#F2CC74}
.hole{position:absolute;left:180px;top:2px;width:64px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center,#01050C 55%,#0d2440 100%);border:3px solid var(--sky);box-shadow:0 0 22px rgba(74,144,217,.55)}
@keyframes slide{0%{transform:translateX(-185px)}72%,100%{transform:translateX(222px)}}
.tap{font-weight:700;font-size:17px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.credit{font-size:13px;color:var(--soft)}
@media (prefers-reduced-motion: reduce){.worm{animation:none;transform:translateX(30px)}.tap{animation:none}}
.card h1{font-family:'Bungee','Figtree',sans-serif;font-weight:400;font-size:36px;line-height:1;margin:0 0 14px;color:var(--sky)}
.card h2{font-family:'Bungee','Figtree',sans-serif;font-weight:400;font-size:26px;line-height:1.1;margin:0 0 12px;color:var(--gold)}
.card p{margin:0 0 14px;line-height:1.45;color:var(--soft);font-size:15px}
.card p.small{font-size:13px}
.modeLabel{font-size:13px;color:var(--soft);margin:4px 0 6px}
.mode{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin:0 0 18px}
.mode button{flex:1;border:0;border-radius:9px;padding:9px 6px;background:transparent;color:var(--white);font:600 14px 'Figtree',system-ui,sans-serif;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--blue)}
.go{font-family:'Bungee','Figtree',sans-serif;font-size:18px;background:var(--gold);color:var(--navy);border:0;border-radius:12px;padding:13px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px);gap:8px;padding-top:12px;touch-action:none}
.pad button{border:1px solid var(--line);border-radius:14px;background:rgba(74,144,217,.16);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.pad button:active,.pad button.on{background:var(--blue)}
.pad svg{width:24px;height:24px}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<div class="splash" id="splash" role="button" tabindex="0" aria-label="Tap to start">
  <canvas id="splashArt" width="320" height="150" aria-hidden="true"></canvas>
  <h1>Hiss Off<br>Home</h1>
  <div class="tap">Tap to start</div>
  <div class="credit">An IndieChip Games production</div>
</div>
<div class="app">
  <div class="hud" aria-live="polite">
    <div class="stat"><span class="k">Level</span><span class="v" id="hLevel">1</span></div>
    <div class="stat"><span class="k">Your length</span><span class="v" id="hLen">7</span></div>
    <div class="stat"><span class="k">Lives</span><span class="v" id="hLives">3</span></div>
    <div class="stat"><span class="k">Score</span><span class="v" id="hScore">0</span></div>
    <button class="snd" id="snd" type="button" aria-pressed="true" aria-label="Sound on"></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="board" role="img" aria-label="Game board"></canvas>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  </div>
  <div class="pad" id="pad">
    <button class="up" data-d="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="left" data-d="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="down" data-d="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="right" data-d="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>
<script>
(function(){
const COLS=15, ROWS=19;
const D={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const DIRS=['up','down','left','right'];
const $=id=>document.getElementById(id);
const cv=$('board'), ctx=cv.getContext('2d'), stage=$('stage'), overlay=$('overlay'), card=$('card');
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cell=20, G=null, mode='step', best=0, overlayAction=null;
try{best=+localStorage.getItem('snakehome.best')||0;const m=localStorage.getItem('snakehome.mode');if(m==='classic'||m==='step')mode=m;}catch(e){}

/* 8-bit sound, generated live with Web Audio (no sound files) */
let AC=null, muted=false, stepAlt=false, compAlt=false;
try{muted=localStorage.getItem('snakehome.muted')==='1';}catch(e){}
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq,dur,type,vol,when,slideTo){
  if(muted)return; const a=audio(); if(!a)return;
  const t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}
const SFX={
  step(){tone(stepAlt?660:587,0.05,'square',0.06);stepAlt=!stepAlt;},
  comp(){tone(compAlt?196:233,0.045,'triangle',0.07);compAlt=!compAlt;},
  bump(){tone(140,0.06,'square',0.05);},
  inHole(){tone(784,0.08,'square',0.06);tone(1047,0.12,'square',0.06,0.08);},
  slurp(n){tone(260+n*45,0.05,'square',0.05,0,180+n*30);},
  home(){[523,659,784,1047].forEach((f,i)=>tone(f,0.11,'square',0.07,i*0.085));tone(1568,0.3,'square',0.05,0.36);tone(784,0.3,'triangle',0.06,0.36);},
  crash(){tone(330,0.4,'sawtooth',0.08,0,60);tone(80,0.3,'square',0.06,0.05);}
};
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintSound(){const b=document.getElementById('snd');b.innerHTML=muted?ICON_OFF:ICON_ON;b.setAttribute('aria-pressed',String(!muted));b.setAttribute('aria-label',muted?'Sound off':'Sound on');}
function toggleSound(){muted=!muted;try{localStorage.setItem('snakehome.muted',muted?'1':'0');}catch(e){}paintSound();if(!muted){audio();SFX.step();}}

const k=(x,y)=>y*COLS+x;
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const rnd=n=>Math.floor(Math.random()*n);
function bodySet(body,skipTail){const s=new Set();const n=skipTail?body.length-1:body.length;for(let i=0;i<n;i++)s.add(k(body[i].x,body[i].y));return s;}
function cheb(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));}

/* Levels come in rounds of 6: your snake shrinks 7 -> 2, then resets and
   another computer snake joins (up to 3). */
const COMP_COLOURS=[['#D9A43E','#F2CC74','gold'],['#D8705A','#F09A84','red'],['#9A7BD6','#C3AAF0','purple']];
const SPAWNS=[
  [{row:3,dir:'right'}],
  [{row:3,dir:'right'},{row:8,dir:'left'}],
  [{row:2,dir:'right'},{row:7,dir:'left'},{row:12,dir:'right'}]
];
function levelParams(n){
  const round=Math.floor((n-1)/6), step=(n-1)%6;
  return{
    round,step,
    comps:Math.min(SPAWNS.length,1+round),
    compLen:7,
    playerLen:7-step,
    tick:Math.max(110,400-step*25-round*30),
    trees:Math.min(22,step*2+round*2),
    enterP:Math.max(0.35,1-step*0.09-round*0.05)   // chance a snake goes in when it could
  };
}

function newGame(){G={level:1,lives:3,score:0};startLevel();}

function startLevel(){
  const p=levelParams(G.level); G.p=p;
  G.comps=SPAWNS[p.comps-1].map((sp,i)=>{
    const body=[];
    for(let j=0;j<p.compLen;j++)body.push(sp.dir==='right'?{x:9-j,y:sp.row}:{x:5+j,y:sp.row});
    return{body,dir:sp.dir,stuck:0,homing:false,gone:false,col:COMP_COLOURS[i]};
  });
  G.player={body:[],dir:'left',queue:[]};
  for(let i=0;i<p.playerLen;i++)G.player.body.push({x:5+i,y:ROWS-4});
  G.hole=null;
  for(let t=0;t<400&&!G.hole;t++){
    const hole=pickHole(); if(!hole)continue;
    const trees=pickTrees(p.trees,hole);
    if(G.comps.every(c=>reachable(c.body[0],hole,trees))){G.hole=hole;G.trees=trees;}
  }
  if(!G.hole){G.hole={x:13,y:10};G.trees=new Set();}
  G.state='ready';G.acc=0;G.homeAcc=0;G.levelStart=0;G.crashWhat='';
  hud();hideOverlay();
}
function allSnakeCells(){return G.comps.flatMap(c=>c.body).concat(G.player.body);}
function pickHole(){
  const cells=allSnakeCells(), crowded=G.comps.length>2;
  for(let t=0;t<300;t++){
    const h={x:1+rnd(COLS-2),y:1+rnd(ROWS-2)};
    if(cells.some(c=>cheb(c,h)<(crowded?2:3)))continue;
    if(G.comps.some(c=>{const ch=c.body[0];return Math.abs(ch.x-h.x)+Math.abs(ch.y-h.y)<(crowded?5:7);}))continue;
    return h;
  }
  return null;
}
function pickTrees(n,hole){
  const s=new Set(), cells=allSnakeCells();
  for(let t=0;t<n*60&&s.size<n;t++){
    const c={x:rnd(COLS),y:rnd(ROWS)};
    if(cheb(c,hole)<=1)continue;
    if(cells.some(q=>cheb(q,c)<=1))continue;
    s.add(k(c.x,c.y));
  }
  return s;
}
function reachable(from,to,trees){
  const seen=new Set([k(from.x,from.y)]), q=[from];
  while(q.length){const c=q.shift();if(c.x===to.x&&c.y===to.y)return true;
    for(const d of DIRS){const nx=c.x+D[d].x,ny=c.y+D[d].y,kk=k(nx,ny);
      if(inB(nx,ny)&&!trees.has(kk)&&!seen.has(kk)){seen.add(kk);q.push({x:nx,y:ny});}}}
  return false;
}

function movePlayer(){
  const pl=G.player;
  if(pl.queue.length){const d=pl.queue.shift();if(d!==OPP[pl.dir])pl.dir=d;}
  const h=pl.body[0],nx=h.x+D[pl.dir].x,ny=h.y+D[pl.dir].y,kk=k(nx,ny);
  let what='';
  if(!inB(nx,ny))what='the wall';
  else if(G.trees.has(kk))what='a tree';
  else if(bodySet(pl.body,true).has(kk))what='yourself';
  else{const hit=G.comps.find(c=>bodySet(c.body,false).has(kk));if(hit)what=`the ${hit.col[2]} snake`;}
  if(what){crash(what);return false;}
  pl.body.unshift({x:nx,y:ny});pl.body.pop();SFX.step();
  return true;
}

function moveComputer(c){
  const h=c.body[0];
  const own=bodySet(c.body,true),blk=bodySet(G.player.body,false);
  for(const o of G.comps)if(o!==c)for(const s of o.body)blk.add(k(s.x,s.y));   // snakes can't touch each other either
  const legal=(x,y)=>inB(x,y)&&!G.trees.has(k(x,y))&&!own.has(k(x,y))&&!blk.has(k(x,y));
  const opts=[];
  for(const d of DIRS){
    if(d===OPP[c.dir])continue;
    const nx=h.x+D[d].x,ny=h.y+D[d].y;
    if(!legal(nx,ny))continue;
    let free=0;
    for(const e of DIRS){if(e===OPP[d])continue;if(legal(nx+D[e].x,ny+D[e].y))free++;}
    opts.push({d,nx,ny,free,isHole:nx===G.hole.x&&ny===G.hole.y});
  }
  if(!opts.length){
    // boxed in: after a short wait it turns round (tail becomes head)
    if(++c.stuck>=3){c.body.reverse();const a=c.body[0],b=c.body[1];
      c.dir=DIRS.find(d=>a.x-b.x===D[d].x&&a.y-b.y===D[d].y)||OPP[c.dir];c.stuck=0;}
    return;
  }
  c.stuck=0;
  let choice;
  const holeOpt=opts.find(o=>o.isHole);
  if(holeOpt&&(opts.length===1||Math.random()<G.p.enterP))choice=holeOpt;
  else{
    const pool=opts.filter(o=>!o.isHole);
    const w=pool.map(o=>(o.d===c.dir?4:1)*(o.free===0?0.05:1));
    let r=Math.random()*w.reduce((a,b)=>a+b,0);
    choice=pool[pool.length-1];
    for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){choice=pool[i];break;}}
  }
  c.dir=choice.d;c.body.unshift({x:choice.nx,y:choice.ny});c.body.pop();
  if(choice.isHole){c.homing=true;SFX.inHole();}
}

function finishLevel(){
  const secs=(performance.now()-G.levelStart)/1000,n=G.comps.length;
  G.gain=100*G.level*n+Math.max(0,Math.round(300*n-secs*8));
  G.score+=G.gain;G.state='done';hud();SFX.home();levelDone();
}
function crash(what){
  G.lives--;G.state='crash';G.crashWhat=what;hud();SFX.crash();
  setTimeout(()=>{
    if(G.lives>0){
      showOverlay(`<h2>Crashed</h2><p>You hit ${what}. ${G.lives} ${G.lives===1?'life':'lives'} left.</p><button class="go" id="ob">Try again</button>`,()=>startLevel());
    }else gameOver();
  },700);
}
function levelDone(){
  const n=levelParams(G.level+1),next=G.level+1,words=['','one','two','three'];
  let msg;
  if(n.step===0&&n.comps>G.comps.length)
    msg=`Level ${next}: your snake is back to full length, but now there are ${words[n.comps]} snakes to get home. They can\u2019t touch each other either, so use that to your advantage.`;
  else if(n.step===0)
    msg=`Level ${next}: your snake is back to full length, with fresh trees and a faster pace.`;
  else
    msg=`Level ${next}: your snake drops to ${n.playerLen}, there are ${n.trees} trees, and everything moves a little faster.`;
  showOverlay(`<h2>${G.comps.length>1?'All home':'Home safe'}</h2><p>+${G.gain} points</p><p class="small">${msg}</p><button class="go" id="ob">Next level</button>`,()=>{G.level++;startLevel();});
}

function input(d){
  if(!G)return;
  if(G.state==='ready'){G.state='play';G.levelStart=performance.now();G.acc=0;}
  if(G.state!=='play')return;
  const pl=G.player;
  if(mode==='classic'){
    const last=pl.queue.length?pl.queue[pl.queue.length-1]:pl.dir;
    if(d===last||d===OPP[last])return;
    if(pl.queue.length<2)pl.queue.push(d);
  }else{
    if(d===OPP[pl.dir])return;
    pl.queue=[d];movePlayer();
  }
}

function hud(){
  $('hLevel').textContent=G?G.level:1;
  $('hLen').textContent=G?G.player.body.length:7;
  $('hLives').textContent=G?G.lives:3;
  $('hScore').textContent=G?G.score:0;
}
function showOverlay(html,action,extra){card.innerHTML=html;overlay.hidden=false;overlayAction=action;card.scrollTop=0;
  const b=$('ob');if(b){b.addEventListener('click',()=>{audio();const a=overlayAction;overlayAction=null;a&&a();});if(!splashOn)b.focus({preventScroll:true});}
  if(extra)for(const id in extra){const e=$(id);if(e)e.addEventListener('click',()=>{audio();extra[id]();});}}

/* leaderboard: top 10 kept on this device */
const clean=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
function loadBoard(){try{const b=JSON.parse(localStorage.getItem('snakehome.board')||'[]');return Array.isArray(b)?b:[];}catch(e){return[];}}
function saveBoard(b){try{localStorage.setItem('snakehome.board',JSON.stringify(b));}catch(e){}}
function bestNow(){const t=loadBoard()[0];return Math.max(best,t?(+t.score||0):0);}
function qualifies(score){if(score<=0)return false;const b=loadBoard();return b.length<10||score>(+b[b.length-1].score||0);}
function addScore(name,score,level){const b=loadBoard(),t=Date.now();b.push({name,score,level,t});
  b.sort((x,y)=>(y.score-x.score)||(x.t-y.t));saveBoard(b.slice(0,10));return t;}
function boardHtml(hl){const b=loadBoard();
  if(!b.length)return '<p>No scores yet. Get the gold snake home to get on the board.</p>';
  return '<ol class="board">'+b.map((e,i)=>`<li class="${e.t===hl?'me':''}"><span class="r">${i+1}</span><span class="n">${clean(e.name)||'???'}</span><span class="l">Level ${(+e.level)|0}</span><span class="s">${(+e.score)|0}</span></li>`).join('')+'</ol>';}
function showBoard(hl){showOverlay(`<h2>Leaderboard</h2>${boardHtml(hl)}<p class="small">Top 10 scores on this device.</p><button class="go" id="ob">Back to start</button>`,showStart);}
function lastInitials(){try{return clean(localStorage.getItem('snakehome.initials'));}catch(e){return'';}}
function gameOver(){
  const score=G.score,level=G.level;
  if(qualifies(score)){
    const top=loadBoard()[0],isTop=!top||score>(+top.score||0);
    showOverlay(`<h2>${isTop?'New high score':'Game over'}</h2><p>Level ${level}, ${score} points. You\u2019ve made the leaderboard.</p>
      <label class="ini">Your initials<input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" value="${lastInitials()}"></label>
      <button class="go" id="ob">Save score</button>`,()=>{
        const v=clean($('initials').value)||'YOU';
        try{localStorage.setItem('snakehome.initials',v);}catch(e){}
        showBoard(addScore(v,score,level));
      });
    const inp=$('initials');
    if(inp){inp.addEventListener('input',()=>{inp.value=clean(inp.value);});setTimeout(()=>{inp.focus();inp.select();},60);}
  }else{
    showOverlay(`<h2>Game over</h2><p>Level ${level}, ${score} points.</p><button class="go" id="ob">Back to start</button><button class="link" id="lb">Leaderboard</button>`,showStart,{lb:()=>showBoard()});
  }
}

/* splash screen */
const splash=$('splash');let splashOn=true;
function closeSplash(){if(!splashOn)return;splashOn=false;audio();SFX.home();splash.classList.add('gone');
  setTimeout(()=>{splash.hidden=true;const b=$('ob');if(b)b.focus({preventScroll:true});},450);}
splash.addEventListener('pointerdown',e=>{e.preventDefault();closeSplash();});
function hideOverlay(){overlay.hidden=true;overlayAction=null;}
function showStart(){
  G=null;hud();
  showOverlay(`<h1>Hiss Off Home</h1>
  <p>The gold snake wanders wherever it likes. You\u2019re the blue one. Get in its way so it has to turn, and steer it into its burrow.</p>
  <p class="small">It can\u2019t touch you, but you can\u2019t touch it either. Each level your snake gets shorter, trees appear and the pace picks up.</p>
  <div class="modeLabel">How your snake moves</div>
  <div class="mode" role="group" aria-label="How your snake moves">
    <button type="button" data-m="step" aria-pressed="${mode==='step'}">One step per tap</button>
    <button type="button" data-m="classic" aria-pressed="${mode==='classic'}">Always moving</button>
  </div>
  ${bestNow()>0?`<p class="small">Best score: ${bestNow()}</p>`:''}
  <button class="go" id="ob">Play</button>
  <button class="link" id="lb">Leaderboard</button>`,newGame,{lb:()=>showBoard()});
  card.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>{
    mode=b.dataset.m;try{localStorage.setItem('snakehome.mode',mode);}catch(e){}
    card.querySelectorAll('.mode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  }));
}

/* drawing */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawSnake(body,bodyCol,headCol,dir,hideFirst){
  const n=body.length;
  for(let i=n-1;i>=0;i--){
    if(hideFirst&&i===0)continue;
    const s=body[i],taper=i===0?0:(i/Math.max(1,n))*cell*0.12,pad=cell*0.06+taper;
    rr(s.x*cell+pad,s.y*cell+pad,cell-pad*2,cell-pad*2,cell*0.3);
    ctx.fillStyle=i===0?headCol:bodyCol;ctx.fill();
  }
  if(hideFirst||!n)return;
  const h=body[0],cx=(h.x+.5)*cell,cy=(h.y+.5)*cell,v=D[dir],px=-v.y,py=v.x;
  ctx.fillStyle='#0A1628';
  for(const s of[-1,1]){ctx.beginPath();ctx.arc(cx+v.x*cell*.16+px*s*cell*.18,cy+v.y*cell*.16+py*s*cell*.18,Math.max(1.5,cell*.08),0,Math.PI*2);ctx.fill();}
}
function draw(t){
  const W=COLS*cell,H=ROWS*cell;
  ctx.fillStyle='#0A1628';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(133,183,235,0.12)';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)ctx.fillRect((x+.5)*cell-1,(y+.5)*cell-1,2,2);
  if(!G)return;
  const hx=(G.hole.x+.5)*cell,hy=(G.hole.y+.5)*cell,pulse=reduceMotion?.5:.5+.5*Math.sin(t/320);
  ctx.beginPath();ctx.arc(hx,hy,cell*.7,0,Math.PI*2);ctx.fillStyle=`rgba(74,144,217,${.1+.14*pulse})`;ctx.fill();
  ctx.beginPath();ctx.arc(hx,hy,cell*.4,0,Math.PI*2);ctx.fillStyle='#01050C';ctx.fill();
  ctx.lineWidth=Math.max(1.5,cell*.08);ctx.strokeStyle='#85B7EB';ctx.stroke();
  G.trees.forEach(kk=>{const x=kk%COLS,y=(kk-x)/COLS,cx=(x+.5)*cell,cy=(y+.5)*cell;
    ctx.beginPath();ctx.arc(cx,cy,cell*.42,0,Math.PI*2);ctx.fillStyle='#2E6A4B';ctx.fill();
    ctx.beginPath();ctx.arc(cx-cell*.08,cy-cell*.08,cell*.22,0,Math.PI*2);ctx.fillStyle='#4F9C70';ctx.fill();});
  G.comps.forEach(c=>{if(!c.gone)drawSnake(c.body,c.col[0],c.col[1],c.dir,c.homing);});
  drawSnake(G.player.body,'#4A90D9','#85B7EB',G.player.dir,false);
  if(G.state==='crash'){const h=G.player.body[0];ctx.lineWidth=3;ctx.strokeStyle='#FF6B6B';
    ctx.beginPath();ctx.arc((h.x+.5)*cell,(h.y+.5)*cell,cell*.6,0,Math.PI*2);ctx.stroke();}
  if(G.state==='ready'){
    const n=G.comps.length,words=['','one','two','three'];
    ctx.fillStyle='rgba(10,22,40,.85)';ctx.fillRect(0,H/2-cell*1.6,W,cell*3.2);
    ctx.fillStyle='#FFFFFF';ctx.textAlign='center';ctx.textBaseline='middle';
    const line=n>1?`Level ${G.level}: ${words[n]} snakes to get home`:`Level ${G.level}`;
    let fs=Math.max(15,Math.round(cell*.78));
    ctx.font=`700 ${fs}px Figtree, system-ui, sans-serif`;
    while(fs>11&&ctx.measureText(line).width>W*.9){fs--;ctx.font=`700 ${fs}px Figtree, system-ui, sans-serif`;}
    ctx.fillText(line,W/2,H/2-cell*.55);
    ctx.font=`600 ${Math.max(13,Math.round(cell*.6))}px Figtree, system-ui, sans-serif`;
    ctx.fillText('Swipe or tap an arrow to start',W/2,H/2+cell*.6);
  }
}

let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(100,t-(last||t));last=t;
  if(G&&(G.state==='play'||G.state==='homing')){
    if(G.state==='play'){
      G.acc+=dt;
      while(G.acc>=G.p.tick&&G.state==='play'){
        G.acc-=G.p.tick;
        if(mode==='classic'&&!movePlayer())break;
        const active=G.comps.filter(c=>!c.homing&&!c.gone);
        active.forEach(moveComputer);
        if(G.comps.some(c=>!c.homing&&!c.gone))SFX.comp();
        else G.state='homing';          // last snake is on its way in
      }
    }
    // snakes that reached the hole slide in while play carries on
    G.homeAcc+=dt;
    while(G.homeAcc>=60){G.homeAcc-=60;
      for(const c of G.comps)if(c.homing){
        if(c.body.length>1){c.body.pop();SFX.slurp(c.body.length);}
        else{c.body=[];c.homing=false;c.gone=true;}
      }
    }
    if(G.state==='homing'&&G.comps.every(c=>c.gone))finishLevel();
  }
  draw(t);
}

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  cell=Math.max(10,Math.floor(Math.min(w/COLS,h/ROWS)));
  const dpr=window.devicePixelRatio||1;
  cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';
  cv.width=Math.round(cell*COLS*dpr);cv.height=Math.round(cell*ROWS*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
window.addEventListener('keydown',e=>{
  if(splashOn){e.preventDefault();closeSplash();return;}
  if(e.target&&e.target.tagName==='INPUT'){
    if(e.key==='Enter'&&overlayAction){e.preventDefault();const a=overlayAction;overlayAction=null;a();}
    return;
  }
  if(e.key==='m'||e.key==='M'){toggleSound();return;}
  if(KEYS[e.key]){e.preventDefault();if(overlay.hidden)input(KEYS[e.key]);return;}
  if((e.key==='Enter'||e.key===' ')&&!overlay.hidden&&overlayAction&&document.activeElement&&document.activeElement.id!=='ob'&&!document.activeElement.dataset.m){
    e.preventDefault();const a=overlayAction;overlayAction=null;a();}
});
let sx=0,sy=0,swiping=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiping=true;});
cv.addEventListener('pointerup',e=>{if(!swiping)return;swiping=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  input(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});
$('pad').querySelectorAll('button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');if(overlay.hidden)input(b.dataset.d);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')));
});


/* splash cartoon: the blue snake chases a worried gold snake into its burrow */
(function(){
  const c=document.getElementById('splashArt'); if(!c)return;
  const x=c.getContext('2d'), W=320, H=150, dpr=Math.max(1,window.devicePixelRatio||1);
  c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const GY=110, HX=252, LG=118, LB=92, RUN=3.1, T=4.5, TAU=Math.PI*2;
  const dip=px=>{const d=px-(HX-30);return d>0?d*d*0.028:0;};
  const pathY=px=>GY-11+Math.sin(px*0.075)*7+dip(px);
  const OUT='#050b16';

  function eye(ex,ey,look,r){
    x.fillStyle=OUT;x.beginPath();x.arc(ex,ey,r+1.6,0,TAU);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,r,0,TAU);x.fill();
    x.fillStyle='#0A1628';x.beginPath();x.arc(ex+look,ey+0.6,r*0.45,0,TAU);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(ex+look-0.8,ey-0.8,r*0.15,0,TAU);x.fill();
  }
  function line(a,b,c2,d,w){x.strokeStyle=OUT;x.lineWidth=w||2.2;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();}

  function scaredFace(hx,hy,t){
    eye(hx-1,hy-6,-2,5.2); eye(hx+9,hy-5,-2,4.6);
    line(hx-6,hy-12,hx+1,hy-14.5); line(hx+6,hy-13.5,hx+12,hy-11.5);        // worried brows
    x.fillStyle=OUT;x.beginPath();x.ellipse(hx+9,hy+4,2.6,3.4,0,0,TAU);x.fill();   // "o" mouth
    const drop=(t*2)%1;                                                      // sweat drop
    x.save();x.globalAlpha*=1-drop;x.fillStyle='#85B7EB';x.beginPath();
    x.arc(hx-12,hy-12+drop*8,2.4,0,TAU);x.fill();x.restore();
  }
  function chaserFace(hx,hy,t){
    eye(hx,hy-6,1.8,4.6); eye(hx+9,hy-5,1.8,4.2);
    line(hx-4,hy-13.5,hx+3,hy-10.5); line(hx+6,hy-10.5,hx+12,hy-12.5);      // determined brows
    x.strokeStyle=OUT;x.lineWidth=2;x.beginPath();x.arc(hx+7,hy+1,5,0.25,Math.PI-0.9);x.stroke(); // grin
    if((t%0.9)<0.3){ // tongue flick
      x.strokeStyle='#E5484D';x.lineWidth=2;x.lineCap='round';x.beginPath();
      x.moveTo(hx+14,hy+3);x.lineTo(hx+21,hy+3);x.lineTo(hx+24,hy+1);x.moveTo(hx+21,hy+3);x.lineTo(hx+24,hy+5);x.stroke();
    }
  }
  function snake(hx,len,body,head,spot,face,t,bob){
    const segs=[];
    for(let s=len;s>=7;s-=4.5){const px=hx-s;segs.push([px,pathY(px)+bob,3.4+(1-s/len)*8]);}
    const hy=pathY(hx)+bob-2;
    x.fillStyle=OUT;
    for(const[px,py,r]of segs){x.beginPath();x.arc(px,py,r+2.2,0,TAU);x.fill();}
    x.beginPath();x.ellipse(hx+2,hy,16.4,14.2,0,0,TAU);x.fill();
    x.fillStyle=body;
    for(const[px,py,r]of segs){x.beginPath();x.arc(px,py,r,0,TAU);x.fill();}
    x.fillStyle=spot;
    segs.forEach(([px,py,r],i)=>{if(i%4===2){x.beginPath();x.arc(px,py-r*0.25,r*0.38,0,TAU);x.fill();}});
    x.fillStyle=head;x.beginPath();x.ellipse(hx+2,hy,14.2,12,0,0,TAU);x.fill();
    face(hx,hy,t);
  }
  function bubble(bx,by,text){
    x.font="12px Bungee, 'Figtree', system-ui, sans-serif";
    const w=x.measureText(text).width+14,h=20;bx=Math.max(4,Math.min(W-w-4,bx));
    x.fillStyle='#fff';x.strokeStyle=OUT;x.lineWidth=2;
    x.beginPath();x.roundRect?x.roundRect(bx,by,w,h,8):x.rect(bx,by,w,h);x.fill();x.stroke();
    x.fillStyle='#0A1628';x.textBaseline='middle';x.textAlign='left';x.fillText(text,bx+7,by+h/2+1);
  }
  function scene(t){
    x.clearRect(0,0,W,H);
    x.globalAlpha=Math.min(1,t/0.25,(T-t)/0.35);
    // ground and tufts
    x.strokeStyle='rgba(133,183,235,.35)';x.lineWidth=2;x.beginPath();x.moveTo(6,GY+6);x.lineTo(W-6,GY+6);x.stroke();
    x.strokeStyle='#4F9C70';x.lineWidth=2;x.lineCap='round';
    for(const gx of[30,96,170,300]){x.beginPath();x.moveTo(gx,GY+6);x.lineTo(gx-3,GY-2);x.moveTo(gx+3,GY+6);x.lineTo(gx+3,GY-4);x.moveTo(gx+6,GY+6);x.lineTo(gx+9,GY-1);x.stroke();}
    // burrow (back half)
    x.fillStyle='#13284a';x.beginPath();x.ellipse(HX,GY+9,46,9,0,0,TAU);x.fill();
    x.fillStyle='#01050C';x.beginPath();x.ellipse(HX,GY+3,36,11,0,0,TAU);x.fill();
    x.strokeStyle='#85B7EB';x.lineWidth=3;x.beginPath();x.ellipse(HX,GY+3,36,11,0,Math.PI,TAU);x.stroke();

    const run=Math.min(t,RUN)/RUN;
    const gHx=-30+run*(HX+LG+40);
    const chase=gHx-LG-34, stopAt=HX-62, stopped=chase>=stopAt;
    const bHx=Math.min(chase,stopAt);
    const bob=stopped?-Math.abs(Math.sin(t*9))*5:0;

    // gold snake, clipped so it disappears down the hole
    x.save();x.beginPath();x.rect(0,0,HX-34,H);x.rect(HX-34,0,90,GY+3);x.clip();
    if(gHx-LG<HX+8)snake(gHx,LG,'#D9A43E','#F2CC74','#B98524',scaredFace,t,0);
    x.restore();
    // blue chaser
    snake(bHx,LB,'#4A90D9','#85B7EB','#2F6FB5',chaserFace,t,bob);
    // front lip of the burrow
    x.strokeStyle='#85B7EB';x.lineWidth=3;x.beginPath();x.ellipse(HX,GY+3,36,11,0,0,Math.PI);x.stroke();

    if(t>0.35&&t<1.7)bubble(gHx-8,GY-58,'Eek!');
    if(stopped&&t>RUN){
      bubble(bHx-20,GY-58,'Hiss off home!');
      const k=(t-RUN)/(T-RUN);
      x.fillStyle='#F2CC74';
      for(const[ox,sp]of[[-14,1],[0,1.3],[14,0.9]]){const sx=HX+ox,sy=GY-8-k*34*sp,r=3*(1-k)+1;
        x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*0.45:r*1.6;x.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr);}x.closePath();x.fill();}
    }
    x.globalAlpha=1;
  }
  if(reduceMotion){scene(RUN+0.5);return;}
  const t0=performance.now();
  (function frame(now){
    if(!splashOn)return;
    scene(((now-t0)/1000)%T);
    requestAnimationFrame(frame);
  })(t0);
})();
document.getElementById('snd').addEventListener('click',toggleSound);paintSound();
resize();showStart();requestAnimationFrame(loop);
})();
</script>
