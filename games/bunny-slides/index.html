<h1 id="t">Bunny Slides</h1><p id="d">Swipe your finger between two slides to build a bridge. Bunnies follow the white rungs too, so plan around them. Guide the bunnies down into their burrow and keep them away from the foxes. Reach 5 burrows to level up!</p>
<div style="display:flex;gap:10px"><button id="go">Start</button><button id="showLb" style="background:rgba(255,255,255,.28)">Scores</button></div></div>
<div id="lb"><h1 style="margin:0 0 4px">Personal Best</h1><ol id="lbList"></ol><button id="lbBack">Back</button></div></div>
<div id="bar"><button id="fast" aria-pressed="false">⏩ Fast</button><button id="clr">Clear bridges</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,laneX=[],topY=60,botY=300,best=0,scores=[];
// Native plugins when running inside the Capacitor app; browser fallbacks otherwise.
const Cap=window.Capacitor,Plug=Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()?Cap.Plugins:{};
const quiet=p=>{try{Promise.resolve(p).catch(()=>{})}catch(e){}};
const store={
  async get(k){try{if(Plug.Preferences)return (await Plug.Preferences.get({key:k})).value;return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{if(Plug.Preferences)quiet(Plug.Preferences.set({key:k,value:String(v)}));else localStorage.setItem(k,v)}catch(e){}}
};
function buzz(bad){try{
  if(Plug.Haptics)quiet(bad?Plug.Haptics.notification({type:'ERROR'}):Plug.Haptics.impact({style:'LIGHT'}));
  else if(navigator.vibrate)navigator.vibrate(bad?[40,30,80]:30)}catch(e){}}
if(Plug.StatusBar)quiet(Plug.StatusBar.hide());
(async()=>{best=+(await store.get('sb_best'))||0;
  try{scores=JSON.parse((await store.get('sb_scores'))||'[]')}catch(e){scores=[]}
  if(!Array.isArray(scores))scores=[];ui()})();
function addScore(s){scores.push(s);scores.sort((a,b)=>b-a);scores=scores.slice(0,10);
  store.set('sb_scores',JSON.stringify(scores))}
function renderScores(){const list=$('lbList');list.innerHTML='';
  if(!scores.length){list.innerHTML='<li class="empty" style="justify-content:center">No runs yet — play a round!</li>';return}
  scores.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML='<span>#'+(i+1)+'</span><span>'+s+'</span>';list.appendChild(li)})}
const st={mode:'ready',score:0,level:1,n:4,bridges:[],fixed:[],chars:[],slots:[],fast:false,wait:0,hold:0,t:0};
const COL=['#5ee0c1','#ff9ecb','#9ec5ff'];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function layout(){laneX=[];for(let i=0;i<st.n;i++)laneX.push(W*(i+.5)/st.n);st.chars.forEach(c=>{if(c.mode==='down')c.x=laneX[c.lane]})}
function resize(){const r=cv.parentNode.getBoundingClientRect(),d=devicePixelRatio||1,ot=topY,ob=botY;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);topY=50;botY=H-80;
  if(ob>ot&&ob!==botY){const f=y=>topY+(y-ot)*(botY-topY)/(ob-ot);st.bridges.concat(st.fixed).forEach(b=>{b.ya=f(b.ya);b.yb=f(b.yb)});st.chars.forEach(c=>{c.y=f(c.y);if(c.ty!=null)c.ty=f(c.ty)})}
  layout()}
function ui(){$('sc').textContent=st.score;$('lv').textContent=st.level;$('bs').textContent=best}
// Pre-made ladder rungs: flat, spread out, and never two rung ends close together on the same lane
function makeRungs(n){
  const out=[],lo=topY+60,hi=botY-50,gap=45;
  for(let tries=0;out.length<n+1&&tries<200;tries++){
    const a=Math.random()*(n-1)|0,y=lo+Math.random()*(hi-lo);
    if(out.some(b=>Math.abs(b.a-a)<=1&&Math.abs(b.ya-y)<gap))continue;
    out.push({a,ya:y,yb:y});
  }
  return out;
}
function newRound(){
  const k=Math.min(3,1+((st.level-1)>>1)),n=3+k;
  if(n!==st.n)st.bridges=[];
  st.n=n;
  st.slots=shuffle([...Array(k).fill('star'),...Array(3).fill('hazard')]);
  st.fixed=makeRungs(n);
  const lanes=shuffle([...Array(n).keys()]).slice(0,k);
  st.chars=lanes.map(l=>({lane:l,x:0,y:topY,mode:'down',done:false}));
  layout();st.chars.forEach(c=>c.x=laneX[c.lane]);st.wait=0;st.hold=1.2;
}
function start(){st.score=0;st.level=1;st.bridges=[];newRound();st.mode='play';$('ov').style.display='none';ui()}
function end(){st.mode='over';if(st.score>0)addScore(st.score);if(st.score>best){best=st.score;store.set('sb_best',best)}ui();
  $('t').textContent='Caught by a fox!';$('d').textContent='You got '+st.score+' bunn'+(st.score===1?'y':'ies')+' home. Best: '+best+'.';$('go').textContent='Try again';$('ov').style.display='flex'}
function step(dt){
  if(st.mode!=='play')return;
  if(st.hold>0){st.hold-=dt;return}
  const m=st.fast?2.6:1,v=(80+st.level*10)*m;
  for(const c of st.chars){
    if(c.done)continue;
    if(c.mode==='across'){const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy),s=300*m*dt;if(d<=s){c.x=c.tx;c.y=c.ty;c.mode='down'}else{c.x+=dx/d*s;c.y+=dy/d*s}continue}
    const ny=c.y+v*dt;let hit=null;
    let he=0;
    for(const b of st.fixed.concat(st.bridges)){if(b.a!==c.lane&&b.a+1!==c.lane)continue;const e=b.a===c.lane?b.ya:b.yb;if(e>c.y&&e<=ny&&!(c.used&&c.used.has(b))&&(!hit||e<he)){hit=b;he=e}}
    if(hit){const fw=hit.a===c.lane;c.y=he;(c.used||(c.used=new Set())).add(hit);c.lane=fw?hit.a+1:hit.a;c.tx=laneX[c.lane];c.ty=fw?hit.yb:hit.ya;c.mode='across';continue}
    c.y=ny;
    if(c.y>=botY){c.y=botY;c.done=true;
      if(st.slots[c.lane]==='hazard'){c.dead=true;buzz(true);end();return}
      st.score++;ding();buzz(false);ui()}
  }
  if(st.chars.every(c=>c.done)){st.wait+=dt;if(st.wait>.6){st.level=1+Math.floor(st.score/5);ui();newRound()}}
}
function hole(x,y,r){
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y+4,r*1.15,r*.6,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'#2a1a0f');g.addColorStop(1,'#6b4423');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r*.85,r*.5,0,0,7);ctx.fill();
  ctx.strokeStyle='#8a5a2f';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,r*.85,r*.5,0,0,7);ctx.stroke();
  ctx.fillStyle='#5b8f3f';for(let i=-1;i<=1;i+=2){ctx.beginPath();ctx.ellipse(x+i*r*.7,y+r*.15,r*.32,r*.16,i*.5,0,7);ctx.fill()}
}
function fox(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#e8783c';ctx.strokeStyle='rgba(50,25,10,.55)';ctx.lineWidth=1.6;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-10,10);ctx.quadraticCurveTo(-16,-6,0,-10);ctx.quadraticCurveTo(16,-6,10,10);ctx.quadraticCurveTo(0,18,-10,10);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(-15,-19);ctx.lineTo(-3,-11);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(9,-6);ctx.lineTo(15,-19);ctx.lineTo(3,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2a140a';
  ctx.beginPath();ctx.moveTo(-12,-15);ctx.lineTo(-8,-8);ctx.lineTo(-3,-11);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(12,-15);ctx.lineTo(8,-8);ctx.lineTo(3,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fdf3e3';ctx.beginPath();ctx.moveTo(-6,4);ctx.quadraticCurveTo(0,10,6,4);ctx.quadraticCurveTo(3,14,0,15);ctx.quadraticCurveTo(-3,14,-6,4);ctx.fill();
  ctx.fillStyle='#2a140a';ctx.beginPath();ctx.arc(-5,-1,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(5,-1,2,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(-2.5,6);ctx.lineTo(2.5,6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function buddy(x,y,col){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,19,13,4,0,0,7);ctx.fill();
  const earA=-.55+.06*Math.sin(st.t*5+x),earB=.55-.06*Math.sin(st.t*5+x+1);
  ctx.fillStyle=col;
  ctx.save();ctx.rotate(earA);ctx.beginPath();ctx.ellipse(-7,-24,4.5,13,0,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.rotate(earB);ctx.beginPath();ctx.ellipse(7,-24,4.5,13,0,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='#ffd7e6';
  ctx.save();ctx.rotate(earA);ctx.beginPath();ctx.ellipse(-7,-24,2,9,0,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.rotate(earB);ctx.beginPath();ctx.ellipse(7,-24,2,9,0,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle=col;ctx.strokeStyle='rgba(50,25,10,.5)';ctx.lineWidth=1.5;ctx.lineJoin='round';
  ctx.beginPath();ctx.ellipse(0,3,15,13,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-9,12,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,8,7,5.5,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';[-6,6].forEach(o=>{ctx.beginPath();ctx.arc(o,-11,4.3,0,7);ctx.fill()});
  ctx.fillStyle='#1b2340';[-6,6].forEach(o=>{ctx.beginPath();ctx.arc(o,-10,2.1,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o+.8,-11,.7,0,7);ctx.fill();ctx.fillStyle='#1b2340'});
  ctx.fillStyle='#ffb6c9';ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(-2.5,-1);ctx.lineTo(2.5,-1);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#7a5240';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(0,1);ctx.moveTo(0,1);ctx.quadraticCurveTo(-4,3,-6,1);ctx.moveTo(0,1);ctx.quadraticCurveTo(4,3,6,1);ctx.stroke();
  ctx.restore();
}
function seededJit(seed,n,amp){const a=[];let s=seed*9301+49297;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;a.push((s/233280-.5)*2*amp)}return a}
let actx=null,noiseBuf=null;
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function unlockAudio(){const ac=audio();if(ac&&ac.state==='suspended')ac.resume()}
function ding(){const ac=audio();if(!ac)return;const t=ac.currentTime;
  [1320,1980,2640].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09/(i+1),t+.006);g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.25)});}
function getNoise(ac){if(noiseBuf)return noiseBuf;const len=ac.sampleRate*.3,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noiseBuf=buf;return buf}
function scribble(){const ac=audio();if(!ac)return;const t=ac.currentTime;
  const src=ac.createBufferSource();src.buffer=getNoise(ac);
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000+Math.random()*1600;bp.Q.value=7;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.08);
  src.connect(bp);bp.connect(g);g.connect(ac.destination);src.start(t);src.stop(t+.09)}
function sketchLine(x1,y1,x2,y2,seed){
  const d=Math.hypot(x2-x1,y2-y1),segs=Math.max(2,Math.round(d/22)),j=seededJit(seed,segs+1,1.6);
  ctx.beginPath();
  for(let i=0;i<=segs;i++){const t=i/segs,nx=-(y2-y1)/(d||1),ny=(x2-x1)/(d||1),x=x1+(x2-x1)*t+nx*j[i],y=y1+(y2-y1)*t+ny*j[i];ctx[i?'lineTo':'moveTo'](x,y)}
  ctx.stroke();
}
let paperCv=null,paperW=0,paperH=0;
function buildPaper(){paperCv=document.createElement('canvas');paperCv.width=W;paperCv.height=H;paperW=W;paperH=H;
  const pc=paperCv.getContext('2d');
  const g=pc.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fc06a');g.addColorStop(1,'#5f9c46');
  pc.fillStyle=g;pc.fillRect(0,0,W,H);
  pc.strokeStyle='rgba(60,90,40,.16)';pc.lineWidth=1;
  let s=42;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(let i=0;i<220;i++){const x=rnd()*W,y=rnd()*H,len=8+rnd()*14,a=rnd()*6.28;pc.beginPath();pc.moveTo(x,y);pc.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);pc.stroke()}
  pc.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<40;i++)pc.beginPath(),pc.arc(rnd()*W,rnd()*H,rnd()*2+.5,0,7),pc.fill();
}
function draw(){
  if(!paperCv||paperW!==W||paperH!==H)buildPaper();
  ctx.drawImage(paperCv,0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='rgba(60,80,40,.55)';
  laneX.forEach((x,i)=>sketchLine(x,topY,x,botY,i*7+3));
  ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.85)';
  st.fixed.forEach((b,i)=>sketchLine(laneX[b.a],b.ya,laneX[b.a+1],b.yb,i*11+5));
  ctx.lineWidth=6;ctx.strokeStyle='#8a5a2f';
  st.bridges.forEach((b,i)=>sketchLine(laneX[b.a],b.ya,laneX[b.a+1],b.yb,i*13+17));
  if(trail.length>1){ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.4)';ctx.beginPath();trail.forEach((q,i)=>ctx[i?'lineTo':'moveTo'](q[0],q[1]));ctx.stroke()}
  st.slots.forEach((s,i)=>{const x=laneX[i],y=botY+38;if(s==='star')hole(x,y,24);else fox(x,y)});
  st.chars.forEach((c,i)=>{if(!c.dead)return buddy(c.x,c.y,COL[i]);
    ctx.save();ctx.globalAlpha=.55;ctx.translate(c.x,c.y);ctx.rotate(.5);buddy(0,0,COL[i]);ctx.restore();
    ctx.font='bold 26px "Patrick Hand",sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(120,20,20,.8)';ctx.lineWidth=4;
    ctx.strokeText('!',c.x+16,c.y-30);ctx.fillText('!',c.x+16,c.y-30)});
  if(st.mode==='play'&&st.hold>0){ctx.font='bold 24px "Patrick Hand",sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText('Get ready…',W/2,H/2)}
}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;st.t=t/1000;
  // Only redraw while playing: the start/game-over overlay fully covers the board otherwise (saves battery)
  try{step(dt);if(st.mode==='play')draw()}catch(err){console.error('Bunny Slides frame error:',err)}
  requestAnimationFrame(loop)}
let drawing=false,lc=null,px=null,py=null,trail=[];
function probe(x0,y0,x,y){
  const tol=W/st.n*.16;
  for(let l=0;l<st.n;l++){
    const lx=laneX[l];
    if(lc&&lc.lane===l)continue;
    const crossed=x0!==x&&(x0-lx)*(x-lx)<=0;
    if(!crossed&&Math.abs(x-lx)>=tol)continue;
    if(lc&&Math.abs(l-lc.lane)===1){
      const sx=laneX[lc.lane];let ye=y;
      if(Math.abs(x-sx)>2)ye=lc.y+(y-lc.y)*(lx-sx)/(x-sx);
      ye=Math.max(y-40,Math.min(y+40,ye));
      if(ye>topY+8&&ye<botY-8&&lc.y>topY+8&&lc.y<botY-8){
        const a=Math.min(l,lc.lane),ya=l===a?ye:lc.y,yb=l===a?lc.y:ye;
        if(!st.bridges.some(b=>b.a===a&&Math.abs(b.ya-ya)<10&&Math.abs(b.yb-yb)<10)){st.bridges.push({a,ya,yb});scribble()}
      }
      lc={lane:l,y:ye};
    }else lc={lane:l,y:y};
  }
}
function mv(e){if(st.mode!=='play')return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  trail.push([x,y]);if(trail.length>150)trail.shift();
  if(px===null){px=x;py=y;probe(x,y,x,y);return}
  const k=Math.max(1,Math.ceil(Math.hypot(x-px,y-py)/6));let ax=px,ay=py;
  for(let i=1;i<=k;i++){const nx=px+(x-px)*i/k,ny=py+(y-py)*i/k;probe(ax,ay,nx,ny);ax=nx;ay=ny}
  px=x;py=y}
cv.addEventListener('pointerdown',e=>{unlockAudio();drawing=true;lc=null;px=null;trail=[];try{cv.setPointerCapture(e.pointerId)}catch(_){}mv(e)});
cv.addEventListener('pointermove',e=>{if(drawing)mv(e)});
addEventListener('pointerup',()=>{drawing=false;px=null;trail=[]});
addEventListener('pointercancel',()=>{drawing=false;px=null;trail=[]});
$('go').onclick=start;
$('showLb').onclick=()=>{renderScores();$('ov').style.display='none';$('lb').style.display='flex'};
$('lbBack').onclick=()=>{$('lb').style.display='none';$('ov').style.display='flex'};
$('fast').onclick=e=>{st.fast=!st.fast;e.currentTarget.setAttribute('aria-pressed',st.fast)};
$('clr').onclick=()=>{st.bridges=[]};
addEventListener('resize',resize);
addEventListener('load',resize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize).catch(()=>{});
resize();newRound();ui();requestAnimationFrame(loop);
setTimeout(()=>{const sp=$('splash');sp.classList.add('hide');setTimeout(()=>sp.remove(),550)},900);
</script></body></html>
